# .gitlab-ci.yml

stages:
  - build
  - test
  - deploy

variables:
  TOOL_NAME: "plantilla-chatbot"

# Build stage - Construye imagen Docker con la imagen oficial de Toolforge
build_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - main

# Test stage - Ejecuta tests (opcional, usa la imagen local)
test_code:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA || docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
  script:
    - echo "🧪 Ejecutando tests..."
    - docker run --rm $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA pytest tests/ -v
  only:
    - main
    - merge_requests
  allow_failure: true  # Opcional: no bloquea si los tests fallan

# Deploy stage - Usa el script oficial de Toolforge
deploy_tools:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
      when: never
  script:
    - echo "Desplegando a Toolforge...
  variables:
    TOOLFORGE_IMAGE: "python-3.13"
include:
    - project: "repos/cloud/cicd/gitlab-ci"
      file: "toolforge-cd/deploy-to-toolforge.yaml"
