include:
  - project: 'repos/releng/docpub'
    file: 'includes/publish.yml'

stages:
  - docs
  - deploy

build-documentation:
  stage: docs
  image: python:3.13

  before_script:
    - pip install uv
    - uv sync

  script:
    - uv run sphinx-build -b html docs/source public

  variables:
    DOCS_DIR: public

  artifacts:
    paths:
      - public

  extends:
    - .docpub:build-docs

publish-documentation:
  stage: deploy

  needs:
    - build-documentation

  variables:
    PUB_LOCATION: plantilla-chatbot

  extends:
    - .docpub:publish-docs

pages:
  stage: deploy

  needs:
    - build-documentation

  script:
    - echo "Publishing GitLab Pages"

  pages: true
