[project]
name = "plantilla-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pablo", email = "pabloagujeronegro2013@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "pywikibot>=11.8.0",
    "requests-oauthlib>=2.0.0",
    "requests-sse>=0.5.3",
]

[project.scripts]
plantilla-chatbot = "plantilla_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
